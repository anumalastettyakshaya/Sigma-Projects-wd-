<html>

<head>
        <title>ShopEase | Registration</title>
        <link rel="stylesheet" href="Loginpage.css">
        <link rel="icon"
                href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS_bFHoH5MP-p_WpU8ehO4ViPQMr57Cvgyv_oiU8U7pLYbWLrlClsauP-o&s=10">
</head>

<body style="text-align:center">

        <h1>Registration form</h1>
        <div class="box1">
                <form action="#">
                        <label for="uname">Username:</label>
                        <input type="text" id="uname" name="uname" placeholder="Enter your Username" required>

                        <br><br>

                        <label for="name">Name:</label>
                        <input type="text" id="name" placeholder="Enter your name" name="name" required>

                        <br><br>

                        <label for="pass">Password:</label>
                        <input type="password" id="pass" name="pass" placeholder="Enter your password" required>

                        <br><br>

                        <label for="date">Date of Birth:</label>
                        <input type="date" id="date">

                        <br><br>

                        <label for="mail">Email:</label>
                        <input type="email" id="mail" name="email" placeholder="Enter your email" required>

                        <br><br>

                        <label for="num">Phone Number:</label>
                        <input type="tel" id="num" name="num" placeholder="Enter your phone number">

                        <br><br>

                        <label for="add">Address:</label>
                        <textarea rows=3 cols=30 id="add" placeholder="Enter your address"></textarea>

                        <br><br>

                        <label for="gen">Gender</label>
                        <select id="gen" name="gen">
                                <option value="">Choose gender</option>
                                <option value="f">Female</option>
                                <option value="m">Male</option>
                                <option value="o">Other</option>
                        </select>

                        <br><br>
                        <div class="links">
                                <a href="Home page.html">Register</a>
                        </div>
                </form>
        </div>
</body>

</html>
