<html>

<head>
    <title>ShopEase | Login</title>
    <link rel="stylesheet" href="Loginpage.css">
    <link rel="icon"
        href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS_bFHoH5MP-p_WpU8ehO4ViPQMr57Cvgyv_oiU8U7pLYbWLrlClsauP-o&s=10">
</head>

<body style="text-align:center">

    <h1>Login page</h1>
    <div class="box">
        <form action="#" method="post">
            <label for="name">Username:</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <br><br>

            <label for="pass">Password:</label>
            <input type="password" id="pass" placeholder="Enter your password" required>

            <br><br>

            <label for="mail">Email:</label>
            <input type="email" id="mail" placeholder="Enter your email" required>

            <br><br>
            <div class="links">
                <div class="loginlink"><a href="Home page.html">Login</a></div>
                <a href="Rgistration page.html">Register</a>
            </div>
        </form>
    </div>
</body>

</html>
